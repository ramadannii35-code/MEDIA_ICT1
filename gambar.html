<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Gambar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap');

  :root {
    --primary: #6c63ff;
    --secondary: #ff6584;
    --accent: #43e97b;
    --bg: #f0f4ff;
    --card: #ffffff;
    --text: #2d2d4e;
    --shadow: 0 8px 32px rgba(108,99,255,0.13);
    --biru-tua: #1e3a8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body{
    min-height:100vh;font-family:'Nunito',sans-serif;
    background:linear-gradient(150deg,#0d2137 0%,#1a3a5c 50%,#1f5f74 100%);
    color:#fff;padding-bottom:80px;
  }

  .rainbow{position:fixed;top:0;left:0;right:0;height:6px;z-index:100;
    background:repeating-linear-gradient(90deg,
      #E63946 0 16.6%,#FFD60A 16.6% 33.2%,#2DC653 33.2% 49.8%,
      #457B9D 49.8% 66.4%,#FF9F1C 66.4% 83%,#7B2D8B 83% 100%);}

  .nav{
    position:sticky;top:0;z-index:90;display:flex;align-items:center;
    justify-content:space-between;padding:12px 24px;
    background:rgba(245,240,232,.92);backdrop-filter:blur(10px);
    border-bottom:2px solid rgba(29,53,87,.1);margin-top:6px;
  }
  .nav-left{display:flex;gap:8px;}
  .nav-btn{
    padding:7px 16px;border-radius:50px;font-size:.82rem;font-weight:800;
    cursor:pointer;text-decoration:none;border:2px solid;transition:all .2s;
  }
  .btn-home{background:var(--biru-tua);color:#fff;border-color:var(--biru-tua);}
  .btn-home:hover{opacity:.85;}
  .btn-menu{background:transparent;color:var(--biru-tua);border-color:var(--biru-tua);}
  .btn-menu:hover{background:var(--biru-tua);color:#fff;}
  .nav-title{font-family:'Baloo 2',cursive;font-size:1rem;color:var(--biru-tua);font-weight:700;}

  main { padding: 22px 16px 40px; max-width: 700px; margin: 0 auto; }

/* ── Hero banner ── */
    .hero{
      background:linear-gradient(135deg,var(--biru-tua) 0%,#457B9D 60%,#A8DADC 100%);
      color:#fff;text-align:center;padding:60px 24px 50px;position:relative;overflow:hidden;
    }
    .hero::before{
      content:'🗺️';font-size:200px;position:absolute;
      top:-40px;right:-30px;opacity:.06;line-height:1;
    }
    .hero-badge{
      display:inline-block;background:var(--kuning);color:#000000;
      font-weight:900;padding:6px 22px;border-radius:50px;font-size:.82rem;
      text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;
    }
    .hero h1{font-family:'Baloo 2',cursive;font-size:clamp(2rem,6vw,3.2rem);margin-bottom:10px;}
    .hero h1 em{color:var(--kuning);font-style:normal;}
    .hero p{color:rgba(255,255,255,.75);font-size:1rem;max-width:500px;margin:0 auto 20px;}
    .hero-emojis{font-size:2rem;letter-spacing:8px;}

  main { padding: 20px 16px 20px; max-width: 680px; margin: 0 auto; }
  .section-title {
    font-family: 'Baloo 2', cursive; font-size: 1.2rem; font-weight: 800;
    color: #b9acff; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  .filter-area { margin-bottom: 20px; }
  .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  .tab-btn {
    padding: 8px 16px; border-radius: 20px; border: 2px solid var(--primary);
    background: transparent; color: #c4bfff;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.82rem;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .tab-btn.active, .tab-btn:hover { background: var(--primary); color: white; }

  .tab-edit-btn {
    background: rgba(255,255,255,.2); border: none; border-radius: 50%;
    width: 18px; height: 18px; font-size: .65rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    color: white; transition: background .2s; flex-shrink: 0;
  }
  .tab-edit-btn:hover { background: rgba(255,255,255,.4); }

  .btn-add-category {
    padding: 8px 16px; border-radius: 20px; border: 2px dashed rgba(108,99,255,.5);
    background: transparent; color: rgba(180,170,255,.7);
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.82rem;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-add-category:hover { border-color: var(--primary); color: #c4bfff; background: rgba(108,99,255,.1); }

  .image-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 28px; }

  .image-card {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    overflow: hidden; transition: transform 0.22s, box-shadow 0.22s;
    animation: fadeIn 0.4s ease both; position: relative;
    display: none;
  }
  .image-card.show { display: block; }
  .image-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(108,99,255,0.18); }

  .img-wrap {
    width: 100%; aspect-ratio: 4/3; overflow: hidden;
    background: linear-gradient(135deg, #e0d7ff, #ffd6e7);
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
  }

  .emoji-ph { font-size: 3.5rem; z-index: 1; }
  .custom-photo {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0; opacity: 0;
    transition: opacity 0.35s ease;
  }
  .custom-photo.show { opacity: 1; }

  .img-label {
    position: absolute; top: 8px; right: 8px;
    background: var(--secondary); color: white;
    border-radius: 8px; font-size: 0.68rem; font-weight: 800;
    padding: 2px 8px; letter-spacing: 0.5px; z-index: 2;
  }

  .btn-del-card {
    position: absolute; top: 8px; left: 8px;
    background: rgba(230,57,70,.85); color: white; border: none;
    border-radius: 50%; width: 26px; height: 26px; font-size: .8rem;
    cursor: pointer; z-index: 3; display: none; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .image-card:hover .btn-del-card { display: flex; }
  .btn-del-card:hover { background: #c1121f; }

  .file-input { display: none; }

  .card-info { padding: 10px 12px 12px; }
  .card-title {
    font-weight: 800; font-size: 0.95rem; margin-bottom: 3px;
    color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .card-title-text { flex: 1; }
  .title-edit-btn {
    font-size: .7rem; background: rgba(108,99,255,.12); border: none;
    border-radius: 6px; padding: 2px 6px; cursor: pointer; color: var(--primary);
    font-family: 'Nunito', sans-serif; font-weight: 700; opacity: 0;
    transition: opacity .2s;
  }
  .image-card:hover .title-edit-btn { opacity: 1; }
  .card-desc { font-size: 0.78rem; color: #888; line-height: 1.4; }

  .add-card-tile {
    background: rgba(255,255,255,.08); border: 2px dashed rgba(108,99,255,.4);
    border-radius: 18px; display: none; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; transition: all .2s; min-height: 180px;
    color: rgba(180,170,255,.7); gap: 8px;
  }
  .add-card-tile.show { display: flex; }
  .add-card-tile:hover { border-color: var(--primary); background: rgba(108,99,255,.15); color: #c4bfff; }
  .add-card-tile .plus { font-size: 2rem; }
  .add-card-tile .plus-label { font-size: .82rem; font-weight: 700; }

  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(20,10,50,0.88); z-index: 999;
    align-items: center; justify-content: center; padding: 20px;
  }
  .lightbox.open { display: flex; }

  .lightbox-content {
    background: white; border-radius: 22px; padding: 20px;
    max-width: 440px; width: 100%; text-align: center;
    position: relative; animation: popIn 0.3s cubic-bezier(.175,.885,.32,1.275);
    max-height: 90vh; overflow-y: auto;
  }

  .lightbox-img-wrap {
    width: 100%; aspect-ratio: 4/3; border-radius: 14px; overflow: hidden;
    background: linear-gradient(135deg, #e0d7ff, #ffd6e7);
    display: flex; align-items: center; justify-content: center;
    font-size: 5rem; margin-bottom: 14px; position: relative;
  }
  .lightbox-img-wrap img.lb-photo {
    width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0;
  }

  .lightbox-title { font-family: 'Baloo 2', cursive; font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
  .lightbox-desc { font-size: 0.88rem; color: #666; line-height: 1.6; margin-bottom: 14px; }

  .lightbox-close {
    position: absolute; top: 12px; right: 14px;
    font-size: 1.5rem; background: none; border: none; cursor: pointer; color: #aaa; font-weight: 900;
  }

  .btn-row-lb { display: flex; gap: 10px; }

  .btn-primary {
    flex: 1; background: linear-gradient(135deg, var(--primary), #a78bfa);
    color: white; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem;
    border: none; border-radius: 14px; padding: 12px 10px;
    cursor: pointer; text-align: center; transition: transform 0.18s;
    box-shadow: 0 4px 16px rgba(108,99,255,0.25);
  }
  .btn-primary:hover { transform: translateY(-2px); }

  .btn-outline-lb {
    flex: 1; background: white; color: var(--primary);
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem;
    border: 2px solid var(--primary); border-radius: 14px; padding: 12px 10px;
    cursor: pointer; text-align: center; transition: all 0.18s; text-decoration: none;
    display: inline-block;
  }
  .btn-outline-lb:hover { background: var(--primary); color: white; }

  .btn-reset-photo {
    background: #fff0f3; color: var(--secondary); border: 2px solid var(--secondary);
    border-radius: 10px; font-family: 'Nunito', sans-serif; font-weight: 700;
    font-size: 0.78rem; padding: 5px 12px; cursor: pointer; margin-bottom: 12px;
    display: none; transition: all 0.18s;
  }
  .btn-reset-photo:hover { background: var(--secondary); color: white; }
  .btn-reset-photo.visible { display: inline-block; }

  .info-banner {
    background: linear-gradient(135deg, #1a3a5c, #1f5f74);
    border-left: 4px solid #6c63ff;
    border-radius: 14px; padding: 14px 16px; margin-bottom: 22px;
    font-size: 0.86rem; color: rgba(255,255,255,.85); line-height: 1.6;
  }

  .fun-badge {
    display: inline-block; background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: white; border-radius: 10px; padding: 3px 10px;
    font-size: 0.78rem; font-weight: 800; margin-left: 8px; vertical-align: middle;
  }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #2d2d4e; color: white; border-radius: 14px;
    padding: 10px 22px; font-weight: 700; font-size: 0.88rem;
    opacity: 0; transition: all 0.3s; z-index: 9999; white-space: nowrap; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; box-shadow: 0 -4px 20px rgba(0,0,0,0.09);
    display: flex; justify-content: space-around; padding: 10px 0 6px; z-index: 200;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 0.68rem; font-weight: 700; color: #bbb; text-decoration: none;
  }
  .nav-item.active { color: var(--primary); }
  .nav-item .nav-icon { font-size: 1.4rem; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(10,10,30,.75); z-index: 1000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: white; border-radius: 20px; padding: 28px 24px;
    max-width: 360px; width: 100%; text-align: left;
    animation: popIn .3s cubic-bezier(.175,.885,.32,1.275);
  }
  .modal-box h3 {
    font-family: 'Baloo 2', cursive; font-size: 1.2rem; color: var(--primary);
    margin-bottom: 16px;
  }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: .82rem; font-weight: 700; color: #555; margin-bottom: 6px; }
  .modal-field input, .modal-field textarea {
    width: 100%; border: 2px solid #e0d7ff; border-radius: 10px;
    padding: 10px 12px; font-family: 'Nunito', sans-serif; font-size: .9rem;
    color: var(--text); outline: none; transition: border .2s;
  }
  .modal-field input:focus, .modal-field textarea:focus { border-color: var(--primary); }
  .modal-field textarea { resize: vertical; min-height: 72px; }
  .modal-field input[type="color"] { padding: 4px 8px; height: 44px; cursor: pointer; }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btn-ok {
    flex: 1; background: linear-gradient(135deg, var(--primary), #a78bfa);
    color: white; border: none; border-radius: 12px; padding: 12px;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .95rem;
    cursor: pointer; transition: transform .18s;
  }
  .modal-btn-ok:hover { transform: translateY(-2px); }
  .modal-btn-cancel {
    flex: 1; background: white; color: #999; border: 2px solid #ddd;
    border-radius: 12px; padding: 12px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  .modal-btn-cancel:hover { border-color: #bbb; color: #666; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes popIn { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }
</style>
</head>

      <span id="lbEmoji"></span>

    </div>
  </div>
</div>

<!-- Modal: Tambah / Edit Kartu -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Tambah Kartu Baru</h3>
    <div class="modal-field">
      <label>Emoji / Ikon</label>
      <input type="text" id="mEmoji" placeholder="Contoh: 🏝️" maxlength="4">
    </div>
    <div class="modal-field">
      <label>Judul</label>
      <input type="text" id="mCardTitle" placeholder="Contoh: Pantai Raja Ampat">
    </div>
    <div class="modal-field">
      <label>Deskripsi</label>
      <textarea id="mCardDesc" placeholder="Tuliskan keterangan singkat..."></textarea>
    </div>
    <div class="modal-field">
      <label>Label Badge (pojok kanan atas)</label>
      <input type="text" id="mCardLabel" placeholder="Contoh: BAJU ADAT" maxlength="20">
    </div>
    <div class="modal-field">
      <label>Warna Badge</label>
      <input type="color" id="mCardColor" value="#6c63ff">
    </div>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="closeModal()">Batal</button>
      <button class="modal-btn-ok" id="modalOkBtn" onclick="modalOk()">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal: Tambah / Ubah Nama Kategori -->
<div class="modal-overlay" id="modalCat">
  <div class="modal-box">
    <h3 id="modalCatTitle">Tambah Kategori Baru</h3>
    <div class="modal-field">
      <label>Emoji Kategori</label>
      <input type="text" id="mCatEmoji" placeholder="Contoh: 🌴" maxlength="4">
    </div>
    <div class="modal-field">
      <label>Nama Kategori</label>
      <input type="text" id="mCatName" placeholder="Contoh: Lombok">
    </div>
    <div class="modal-field">
      <label>Label Badge (singkat)</label>
      <input type="text" id="mCatLabel" placeholder="Contoh: NTB" maxlength="12">
    </div>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="closeModalCat()">Batal</button>
      <button class="modal-btn-ok" id="modalCatOkBtn" onclick="modalCatOk()">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ============================================================
//  STATE
// ============================================================
const STORE_PHOTO = 'galeri_foto_';
const STORE_DATA  = 'galeri_data_v3';
const STORE_ORDER = 'galeri_order_v3';

let categories      = {};
let catOrder        = [];
let currentCat      = '';
let currentLightId  = null;
let globalCardIndex = 0;
let cardDataMap     = {};

let modalMode       = '';
let modalEditId     = null;
let modalCatMode    = '';
let modalEditCatKey = '';

// ============================================================
//  PERSISTENCE
// ============================================================
function loadData() {
  try {
    // Bersihkan foto format lama (galeri_foto_0, galeri_foto_1, ...) yang memenuhi localStorage
    const keysToDelete = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(STORE_PHOTO)) keysToDelete.push(k);
    }
    keysToDelete.forEach(k => localStorage.removeItem(k));

    const raw = localStorage.getItem(STORE_DATA);
    const ord = localStorage.getItem(STORE_ORDER);
    if (raw) {
      categories = JSON.parse(raw);
      catOrder   = ord ? JSON.parse(ord) : Object.keys(categories);
      // Migrasi: beri uid pada kartu lama yang belum punya uid
      catOrder.forEach(cat => {
        if (!categories[cat]) return;
        categories[cat].cards.forEach((card, i) => {
          if (!card.uid) card.uid = cat + '_legacy_' + i + '_' + Date.now();
        });
      });
    } else {
      categories = JSON.parse(JSON.stringify(defaultCategories));
      catOrder   = Object.keys(categories);
    }
  } catch(e) {
    categories = JSON.parse(JSON.stringify(defaultCategories));
    catOrder   = Object.keys(categories);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORE_DATA,  JSON.stringify(categories));
    localStorage.setItem(STORE_ORDER, JSON.stringify(catOrder));
  } catch(e) {
    // localStorage penuh — coba hapus foto lama satu per satu lalu coba lagi
    if (e.name === 'QuotaExceededError' || e.code === 22) {
      showToast('⚠️ Penyimpanan penuh! Beberapa foto mungkin tidak tersimpan.');
      // Hapus semua entry foto lama (format lama: galeri_foto_0, galeri_foto_1, ...)
      const keysToDelete = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(STORE_PHOTO)) keysToDelete.push(k);
      }
      keysToDelete.forEach(k => localStorage.removeItem(k));
      // Coba simpan lagi
      try {
        localStorage.setItem(STORE_DATA,  JSON.stringify(categories));
        localStorage.setItem(STORE_ORDER, JSON.stringify(catOrder));
      } catch(e2) {
        showToast('⚠️ Storage tetap penuh. Hapus foto dari kartu lain dulu.');
      }
    }
  }
}

function getSaved(id)      { try { return localStorage.getItem(STORE_PHOTO+id); }  catch(e) { return null; } }
function setSaved(id, val) { try { localStorage.setItem(STORE_PHOTO+id, val); }    catch(e) { showToast('⚠️ Penyimpanan penuh.'); } }
function removeSaved(id)   { try { localStorage.removeItem(STORE_PHOTO+id); }      catch(e) {} }

// ============================================================
//  BUILD TABS
// ============================================================
function buildTabs() {
  const container = document.getElementById('filterTabs');
  container.innerHTML = '';
  catOrder.forEach(key => {
    const cat = categories[key];
    if (!cat) return;
    const btn = document.createElement('button');
    btn.className  = 'tab-btn' + (key === currentCat ? ' active' : '');
    btn.dataset.cat = key;
    btn.innerHTML  = `${cat.emoji} ${cat.name}
      <span class="tab-edit-btn" title="Ubah nama" onclick="openEditCategoryModal('${key}',event)">✏️</span>`;
    btn.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-edit-btn')) return;
      filterCards(key, btn);
    });
    container.appendChild(btn);
  });
}

// ============================================================
//  BUILD GRID
// ============================================================
function generateCards() {
  const grid = document.getElementById('imageGrid');
  grid.innerHTML  = '';
  globalCardIndex = 0;
  cardDataMap     = {};

  catOrder.forEach(cat => {
    const catData = categories[cat];
    if (!catData) return;
    catData.cards.forEach((cardData, i) => {
      if (!cardData.uid) {
        cardData.uid = cat + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
      }
      const id = globalCardIndex++;
      cardDataMap[id] = { cat, catIndex: i, cardData, uid: cardData.uid };
      grid.insertAdjacentHTML('beforeend', createCardHtml(cat, id, cardData, i));
    });
  });

  // Add-card tile
  const tile = document.createElement('div');
  tile.className = 'add-card-tile';
  tile.id        = 'addCardTile';
  tile.innerHTML = '<span class="plus">\uFF0B</span><span class="plus-label">Tambah Kartu Baru</span>';
  tile.onclick   = () => openAddCardModal();
  grid.appendChild(tile);

  // Restore saved photos — langsung dari cardData.image
  Object.keys(cardDataMap).forEach(id => {
    const cardData = cardDataMap[id].cardData;
    if (cardData.image) {
      const img = document.getElementById('img'+id);
      if (img) { img.src = cardData.image; img.classList.add('show'); }
    }
  });

  updateTotalBadge();
}

function createCardHtml(cat, id, cardData, catIndex) {
  const cardLabel      = cardData.label      || categories[cat].label;
  const cardLabelColor = cardData.labelColor || LABEL_COLORS[id % LABEL_COLORS.length];
  return `
    <div class="image-card" data-cat="${cat}" data-id="${id}" data-cat-index="${catIndex}">
      <div class="img-wrap" onclick="openLight(${id})">
        <span class="emoji-ph">${cardData.emoji}</span>
        <img class="custom-photo" src="" alt="${cardData.title}" id="img${id}">
        <span class="img-label" style="background:${cardLabelColor}">${cardLabel}</span>
        <button class="btn-del-card" title="Hapus kartu" onclick="deleteCard(event,${id})">✕</button>
      </div>
      <input class="file-input" type="file" accept="image/*" id="f${id}" onchange="handleUpload(${id},this)">
      <div class="card-info">
        <div class="card-title">
          <span class="card-title-text">${cardData.title}</span>
          <button class="title-edit-btn" onclick="openEditCardModal(event,${id})">✏️ Edit</button>
        </div>
        <div class="card-desc">${cardData.desc}</div>
      </div>
    </div>
  `;
}

function updateTotalBadge() {
  const total = catOrder.reduce((s,k) => s + (categories[k]?.cards.length || 0), 0);
  document.getElementById('totalBadge').textContent = `${total} Foto`;
}
// ============================================================
//  FILTER
// ============================================================
function filterCards(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.image-card').forEach(card => card.classList.remove('show'));

  const matching = document.querySelectorAll(`.image-card[data-cat="${cat}"]`);
  matching.forEach((card, i) => {
    setTimeout(() => {
      card.classList.add('show');
      card.style.animation = 'fadeIn 0.4s ease both';
    }, i * 60);
  });

  const tile = document.getElementById('addCardTile');
  if (tile) {
    tile.classList.add('show');
    const last = [...matching].pop();
    if (last) last.after(tile);
  }

  showToast(`📂 ${categories[cat]?.cards.length || 0} foto · ${categories[cat]?.name}`);
}

function openAddCardModal() {
  modalMode   = 'add-card';
  modalEditId = null;
  document.getElementById('modalTitle').textContent = '➕ Tambah Kartu Baru';
  document.getElementById('mEmoji').value           = '🖼️';
  document.getElementById('mCardTitle').value       = '';
  document.getElementById('mCardDesc').value        = '';
  document.getElementById('mCardLabel').value       = '';        // ← kosongkan
  document.getElementById('mCardColor').value       = '#6c63ff'; // ← warna default
  document.getElementById('modalOkBtn').textContent = 'Tambahkan';
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditCardModal(e, id) {
  e.stopPropagation();
  modalMode   = 'edit-card';
  modalEditId = id;
  const card = document.querySelector(`[data-id="${id}"]`);
  const cat  = card.dataset.cat;
  const idx  = parseInt(card.dataset.catIndex);
  const data = categories[cat].cards[idx];

  document.getElementById('modalTitle').textContent = '✏️ Edit Kartu';
  document.getElementById('mEmoji').value           = data.emoji;
  document.getElementById('mCardTitle').value       = data.title;
  document.getElementById('mCardDesc').value        = data.desc;
  document.getElementById('mCardLabel').value       = data.label      || '';        // ← isi label lama
  document.getElementById('mCardColor').value       = data.labelColor || '#6c63ff'; // ← isi warna lama
  document.getElementById('modalOkBtn').textContent = 'Simpan Perubahan';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function modalOk() {
  const emoji  = document.getElementById('mEmoji').value.trim()      || '';
  const title  = document.getElementById('mCardTitle').value.trim();
  const desc   = document.getElementById('mCardDesc').value.trim();
  const label  = document.getElementById('mCardLabel').value.trim();  // ← ambil label
  const color  = document.getElementById('mCardColor').value;         // ← ambil warna
  if (!title) { showToast('⚠️ Judul tidak boleh kosong!'); return; }

  if (modalMode === 'add-card') {
    if (!currentCat) { showToast('⚠️ Pilih kategori terlebih dahulu!'); return; }
    categories[currentCat].cards.push({
      uid:        currentCat + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,5),
      emoji, title, desc,
      label:      label || categories[currentCat].label,
      labelColor: color,
      image:      ''
    });
    showToast('✅ Kartu berhasil ditambahkan!');

  } else if (modalMode === 'edit-card') {
    const card = document.querySelector(`[data-id="${modalEditId}"]`);
    const cat  = card.dataset.cat;
    const idx  = parseInt(card.dataset.catIndex);
    const old  = categories[cat].cards[idx];       // ← data lama
    categories[cat].cards[idx] = {
      uid:        old.uid,                          // ← uid tetap aman
      emoji, title, desc,
      label:      label || old.label,              // ← pertahankan jika kosong
      labelColor: color || old.labelColor,         // ← pertahankan jika kosong
      image:      old.image                        // ← foto tetap aman
    };
    showToast('✅ Kartu berhasil diperbarui!');
  }

  saveData();
  closeModal();
  rebuildAll();
}

// ============================================================
//  DELETE CARD
// ============================================================
function deleteCard(e, id) {
  e.stopPropagation();
  if (!confirm('Hapus kartu ini?')) return;
  const card = document.querySelector(`[data-id="${id}"]`);
  const cat  = card.dataset.cat;
  const idx  = parseInt(card.dataset.catIndex);
  categories[cat].cards.splice(idx, 1);
  removeSaved(id);
  saveData();
  rebuildAll();
  showToast('🗑️ Kartu dihapus.');
}

  if (currentLightId === null) return;
  const info = cardDataMap[currentLightId];

    const { cat, catIndex } = info;
    categories[cat].cards[catIndex].image = '';

  const oldLb = wrap.querySelector('img.lb-photo');
  if (oldLb) oldLb.remove();
  showToast('🗑️ Foto dihapus.');
}

// ============================================================
//  UPLOAD FOTO
// ============================================================
// ============================================================
//  COMPRESS IMAGE sebelum disimpan (max 400px, quality 0.7)
// ============================================================
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const MAX = 400;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } }
      else        { if (h > MAX) { w = w * MAX / h; h = MAX; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ============================================================
//  UPLOAD FOTO
// ============================================================
function handleUpload(id, input) {
  const file = input.files[0];
  if (!file) return;
  compressImage(file, function(data) {
    const info = cardDataMap[id];
    if (info) {
      const { cat, catIndex } = info;
      categories[cat].cards[catIndex].image = data;
      try {
        saveData();
      } catch(e) {
        showToast('⚠️ Penyimpanan penuh! Hapus beberapa foto dulu.');
        return;
      }
    }
    const img = document.getElementById('img'+id);
    if (img) { img.src = data; img.classList.add('show'); }
    if (currentLightId === id) {
      const wrap = document.getElementById('lbImgWrap');
      let lb = wrap.querySelector('img.lb-photo');
      if (!lb) { lb = document.createElement('img'); lb.className = 'lb-photo'; wrap.appendChild(lb); }
      lb.src = data;
      document.getElementById('btnReset').classList.add('visible');
    }
    showToast('✅ Foto berhasil disimpan!');
  });
}

  const prevCat = currentCat;
  buildTabs();
  generateCards();
  if (prevCat && categories[prevCat]) {
    const btn = document.querySelector(`.tab-btn[data-cat="${prevCat}"]`);
    filterCards(prevCat, btn);
  }
}

  const t = document.getElementById('toast');

  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
